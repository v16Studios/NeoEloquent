name: Fork release validation

on:
  push:
    branches: [master, upgrade/neoeloquent-9.9-laravel-13]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 / Laravel ${{ matrix.laravel }} / Neo4j 5.26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5.12'
          tools: composer:2.10.2
          coverage: none
      - name: Install locked dependencies and verify on disposable graph
        run: bash tests/compatibility/verify-release.sh '${{ matrix.laravel }}'
      - name: Preserve actual results, exclusions and environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-laravel${{ matrix.laravel }}
          path: logs/release-laravel${{ matrix.laravel }}/
          if-no-files-found: error
