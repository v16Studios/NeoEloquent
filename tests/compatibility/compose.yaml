name: nxs-neoeloquent

services:
  neo4j:
    image: neo4j:5.26-community@sha256:414adfe41c6ff32abb752be37f265c77607c166cab298f65a917fc4f05776218
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  tests:
    build: .
    network_mode: service:neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../../src:/workspace/src:ro
      - ../../tests:/workspace/tests:ro
      - ../../vendor:/workspace/vendor:ro
      - ../../composer.json:/workspace/composer.json:ro
      - ../../phpunit.xml:/workspace/phpunit.xml:ro
    environment:
      NEOELOQUENT_DISPOSABLE_GRAPH: '1'
      NEOELOQUENT_EXPECT_FIRST_ID_ZERO: '${NEOELOQUENT_EXPECT_FIRST_ID_ZERO:-0}'
    command: [php, vendor/bin/phpunit, -c, tests/compatibility/phpunit.xml, --do-not-cache-result]

networks:
  isolated:
    internal: true
